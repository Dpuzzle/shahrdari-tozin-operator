services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shahrdari-tozin-operator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - NEXT_PUBLIC_MID_URL=${NEXT_PUBLIC_MID_URL}
      - NEXT_PUBLIC_JWT_KEY=${NEXT_PUBLIC_JWT_KEY}
    volumes:
      - .queue:/app/.queue
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
